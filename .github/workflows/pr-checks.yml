name: PR Checks

on:
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-network: [custom]
    env:
      NETWORK: ${{ matrix.test-network }}
      TEST_NETWORK: ${{ matrix.test-network }}
      MODE: online
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Prepare volume dir
        run: |
          mkdir -p rosetta_data
          chmod -R 777 rosetta_data

      - name: Build Docker images
        run: docker compose build
          
      - name: Run e2e tests
        run: npm run test:e2e:${{ matrix.test-network }}
  rosetta-cli:
    runs-on: ubuntu-latest
    env:
      NETWORK: custom
      MODE: online
      CLI_CONFIG: rosetta-cli-conf/solo/rosetta_cli_config.json
    steps:
      - uses: actions/checkout@v4

      - name: Prepare volume dir
        run: |
          mkdir -p rosetta_data
          chmod -R 777 rosetta_data

      - name: Build Docker images
        run: |
          docker compose build
          docker build -t rosetta-cli rosetta-cli-conf

      - name: Start Rosetta with thor solo
        run: |
          docker compose up -d
          for i in $(seq 1 120); do
            if curl -sf -X POST http://localhost:8080/network/status \
                -H 'Content-Type: application/json' \
                -d '{"network_identifier":{"blockchain":"vechainthor","network":"custom"}}' > /dev/null; then
              echo "Rosetta is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Rosetta did not become ready"
          exit 1

      # Construction first, so that check:data has transactions to reconcile.
      - name: Run rosetta-cli check:construction
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            rosetta-cli check:construction --configuration-file "$CLI_CONFIG"

      - name: Run rosetta-cli check:data
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            rosetta-cli check:data --configuration-file "$CLI_CONFIG"

      - name: Show Docker logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload rosetta-cli results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-cli-results
          path: |
            cli-data/solo/construction_results.json
            cli-data/solo/data_results.json
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v
