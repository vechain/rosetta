services:
  rosetta-server:
    # A fixed name, so the tests (compose project rosetta-e2e) reuse the image built here.
    image: vechain-rosetta
    build:
      context: .
      # Passed through only when set, so the Dockerfile defaults apply otherwise.
      args:
        - THOR_REPO
        - THOR_VERSION
    volumes:
      - ${ROSETTA_DATA:-./rosetta_data}:/data
    ports:
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:8669:8669"
      - "11235:11235"
      - "11235:11235/udp"
    environment:
      - NETWORK=${NETWORK}
      - MODE=${MODE}
      # Passed through only when set; see "Client ID header" in the README.
      - CLIENT_ID_HEADER
      - CLIENT_ID_DEFAULT
    restart: unless-stopped 